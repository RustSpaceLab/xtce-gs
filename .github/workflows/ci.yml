name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # eframe links against X11, Wayland and GL on Linux; a headless runner still has to
      # compile against them.
      - name: System libraries for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The interface is the only part that needs a display. Everything below it must run
      # without one, and these two are what prove it: a definition and a recording go in, a
      # count of decoded packets comes out.
      - run: cargo run --release -p xtce-gs-cli -- probe testdata/jpss/J01_G011_LZ_2021-04-09T00-00-00Z_V01.DAT1
      - run: |
          cargo run --release -p xtce-gs-cli -- replay --headless --rate 0 \
            testdata/jpss/jpss1_geolocation_xtce_v1.xml \
            testdata/jpss/J01_G011_LZ_2021-04-09T00-00-00Z_V01.DAT1 | tee /tmp/pass.txt
          grep -q "decoded=7200 rejected=0 lost=0" /tmp/pass.txt
